<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Englisch-Vokabeltrainer</title>
<style>
body{margin:0;background:linear-gradient(135deg,#eaf3ff,#f8f5ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a}
main{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:28px;padding:22px;box-shadow:0 8px 28px #0002}
h1{margin:0;font-size:25px}.subtitle{color:#66717d;margin:5px 0 18px}.top{display:flex;justify-content:space-between;font-weight:700}
.hearts{letter-spacing:3px}.progress{height:10px;background:#e8ebf0;border-radius:10px;margin:12px 0 24px;overflow:hidden}.bar{height:100%;background:#5b8def;width:0}
.word{font-size:38px;font-weight:800;text-align:center;margin:32px 0}.q{text-align:center;color:#66717d}.answers{display:grid;gap:10px}
button{border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:700;background:#edf2f8;color:#17202a}button:active{transform:scale(.98)}
.feedback{margin-top:16px;padding:15px;border-radius:16px;font-size:18px;text-align:center;min-height:24px}.next{background:#5b8def;color:white;width:100%;margin-top:12px;display:none}
.score{text-align:center;font-size:20px;font-weight:800;margin:20px 0}.small{font-size:13px;color:#6d7782;text-align:center;margin-top:18px;line-height:1.4}
</style>
</head>
<body>
<main><div class="card">
<h1>📚 Englisch-Vokabeltrainer</h1>
<div class="subtitle">Englisch 🇬🇧 → Deutsch 🇩🇪</div>
<div class="top"><span id="round">Start...</span><span id="points">⭐ 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="q">Was bedeutet:</div>
<div class="word" id="word">Lade Vokabel...</div>
<div class="hearts" id="hearts">❤️❤️❤️</div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next">Weiter ➜</button>
<div class="score" id="done"></div>
<div class="small">10 Vokabeln pro Runde · Fehler kommen später wieder.<br>Der Lernstand wird auf diesem Gerät gespeichert.</div>
</div></main>
<script>
const WORDS = [["father", "der Vater"], ["mother", "die Mutter"], ["grandma", "die Oma; die Großmutter"], ["grandpa", "der Opa; der Großvater"], ["aunt", "die Tante"], ["uncle", "der Onkel"], ["cousin", "der Cousin; die Cousine"], ["people", "Leute; Menschen"], ["message", "die Nachricht; die SMS"], ["text message", "die Textnachricht; SMS"], ["conversation", "das Gespräch; die Unterhaltung"], ["question", "die Frage"], ["answer", "die Antwort"], ["to say", "sagen"], ["to hear", "hören"], ["to talk (to)", "reden (mit); sich unterhalten (mit)"], ["to help", "helfen"], ["help", "die Hilfe"], ["again", "wieder; noch einmal"], ["primary school", "die Grundschule"], ["to learn", "lernen"], ["to understand", "verstehen"], ["to pronounce", "aussprechen"], ["to type", "tippen"], ["letter", "der Buchstabe"], ["word", "das Wort"], ["the first word", "das erste Wort"], ["sentence", "der Satz"], ["full stop", "der Punkt (Satzzeichen)"], ["e.g.", "z. B. (zum Beispiel)"], ["careful", "vorsichtig"], ["English", "Englisch; englisch"], ["language", "die Sprache"], ["like words in other languages", "wie Wörter in anderen Sprachen"], ["other", "andere(r, s)"], ["phrase", "der Satz; der Ausdruck; die Redewendung"], ["in English / in German", "auf Englisch / auf Deutsch"], ["free", "frei"], ["to hang out", "abhängen; rumhängen"], ["at my place", "bei mir"], ["place", "der Ort; der Platz; die Stelle"], ["when", "wenn"], ["then", "dann"], ["before", "vor"], ["or", "oder"], ["to use", "benutzen; verwenden"], ["useful", "nützlich"], ["some", "einige; ein paar; etwas"], ["very big", "sehr groß"], ["Good morning.", "Guten Morgen."], ["parcel", "das Paket; das Päckchen"], ["umbrella", "der Schirm; der Regenschirm"], ["your favourite book", "dein Lieblingsbuch"], ["Lily’s letter", "Lilys Brief"], ["Here’s …", "Hier ist …"], ["Here are …", "Hier sind …"], ["There’s …", "Es ist … / Es gibt …"], ["There are …", "Es sind … / Es gibt …"], ["its", "sein(e); ihr(e)"]];

const ALL = WORDS;
let state = null, batch = [], index = 0, points = 0, hearts = 3, locked = false;

function el(id){ return document.getElementById(id); }
function save(){ localStorage.setItem("vocabKids", JSON.stringify(state)); }
function norm(x){
  return String(x).toLowerCase().trim().replace(/[.,!?]/g,"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
}
function shuffle(a){ return a.sort(function(){return Math.random()-0.5;}); }

function startRound(){
  const errors = state.wrong.splice(0,5);
  const count = Math.max(0, 10-errors.length);
  const fresh = ALL.slice(state.seen, state.seen+count);
  state.seen += fresh.length;
  batch = errors.concat(fresh);
  if(batch.length===0){
    batch = ALL.slice(0,10);
  }
  state.round++;
  index=0; points=0; hearts=3;
  save();
  showQuestion();
}

function makeChoices(correct){
  const others = [];
  for(const item of ALL){
    if(item[1] !== correct && others.indexOf(item[1])===-1) others.push(item[1]);
  }
  shuffle(others);
  return shuffle(others.slice(0,3).concat([correct]));
}

function showQuestion(){
  locked=false;
  el("round").textContent="Runde "+state.round+" · "+(index+1)+"/"+batch.length;
  el("points").textContent="⭐ "+points;
  el("bar").style.width=(index/batch.length*100)+"%";
  el("word").textContent=batch[index][0];
  el("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
  el("feedback").textContent="";
  el("next").style.display="none";
  const box=el("answers"); box.innerHTML="";
  makeChoices(batch[index][1]).forEach(function(answer){
    const b=document.createElement("button");
    b.textContent=answer;
    b.onclick=function(){ checkAnswer(answer); };
    box.appendChild(b);
  });
}

function checkAnswer(answer){
  if(locked) return;
  locked=true;
  document.querySelectorAll("#answers button").forEach(function(b){b.disabled=true;});
  if(norm(answer)===norm(batch[index][1])){
    points+=10;
    el("feedback").innerHTML="🎉 Richtig! +10 ⭐";
  }else{
    hearts--;
    state.wrong.push(batch[index]);
    el("feedback").innerHTML="❌ Noch einmal üben!<br><b>Richtig:</b> "+batch[index][1];
  }
  save();
  el("points").textContent="⭐ "+points;
  el("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
  el("next").style.display="block";
}

function next(){
  if(index < batch.length-1){
    index++;
    showQuestion();
    return;
  }
  el("bar").style.width="100%";
  el("word").textContent="🏆 Runde geschafft!";
  el("answers").innerHTML="";
  el("feedback").innerHTML="Du hast <b>"+points+" Punkte</b> gesammelt!";
  el("next").textContent=state.seen<ALL.length ? "➡️ Nächste 10" : "🔁 Fehlertraining";
  el("next").onclick=function(){
    el("next").onclick=next;
    startRound();
  };
}

try{
  state=JSON.parse(localStorage.getItem("vocabKids")||"null");
}catch(e){ state=null; }
if(!state) state={seen:0,wrong:[],round:0,points:0};
el("next").onclick=next;
startRound();

</script>
</body>
</html>
